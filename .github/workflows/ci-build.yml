name: CI Build Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/Casko.OpenTelemetry.Extensions.AspNetCore/Casko.OpenTelemetry.Extensions.AspNetCore.csproj
          - src/Casko.OpenTelemetry.Extensions.Serilog/Casko.OpenTelemetry.Extensions.Serilog.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ matrix.project }}"

      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore
